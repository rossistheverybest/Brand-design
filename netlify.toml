[build]
  command = "npm run build"
  publish = ".next"

# Settings for OUR functions only (netlify/functions/*). They are deliberately
# not under a bare [functions] block: that would also apply to the server
# function Netlify generates for the Next.js site and can break every page.
[functions."worker-background"]
  node_bundler = "esbuild"
  # Native image libraries are installed, not bundled.
  external_node_modules = ["sharp", "@resvg/resvg-js"]
  # Fonts and logos are read from disk while rendering.
  included_files = [
    "node_modules/@fontsource/barlow-condensed/files/*-normal.woff",
    "node_modules/@fontsource/source-sans-3/files/*-normal.woff",
    "assets/logos/*.png",
  ]

[functions."publish-due"]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@resvg/resvg-js"]

[functions."inspiration-weekly"]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@resvg/resvg-js"]
